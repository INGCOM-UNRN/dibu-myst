# Publica el plugin como release de GitHub.
#   git tag v0.1.0 && git push origin v0.1.0
# La versión del tag tiene que coincidir con package.json y con VERSION en src/dibu-myst.mjs.
# El archivo se llama siempre dibu-myst.mjs, para que funcione la URL
# https://github.com/INGCOM-UNRN/dibu-myst/releases/latest/download/dibu-myst.mjs
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existente a publicar (p. ej. v0.1.0)
        required: true
      dibu_ref:
        description: Rama, tag o commit de dibu
        default: main

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  preparar:
    name: Validar versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          set -euo pipefail
          version="${TAG#v}"
          npm_v=$(node -p 'require("./package.json").version')
          src_v=$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' src/dibu-myst.mjs)
          echo "tag=$version package.json=$npm_v src=$src_v"
          if [ "$version" != "$npm_v" ] || [ "$version" != "$src_v" ]; then
            echo "::error::El tag $TAG no coincide con las versiones declaradas"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pruebas:
    needs: preparar
    uses: ./.github/workflows/construir.yml
    with:
      dibu_ref: ${{ inputs.dibu_ref || 'main' }}

  publicar:
    name: Publicar release
    needs: [preparar, pruebas]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Sumas y notas
        run: |
          set -euo pipefail
          v=${{ needs.preparar.outputs.version }}
          (cd dist && sha256sum dibu-myst.mjs > SHA256SUMS)
          cat > NOTAS.md <<NOTAS
          Plugin de MyST \`dibu-myst\` $v, con el motor de dibu \`${{ needs.pruebas.outputs.dibu_sha }}\`.

          En el \`myst.yml\` del proyecto:

          \`\`\`yaml
          project:
            plugins:
              - https://github.com/${{ github.repository }}/releases/download/$TAG/dibu-myst.mjs
          \`\`\`
          NOTAS
      - name: Crear o actualizar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/dibu-myst.mjs dist/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file NOTAS.md
          else
            gh release create "$TAG" dist/dibu-myst.mjs dist/SHA256SUMS --title "dibu-myst $TAG" \
              --notes-file NOTAS.md --verify-tag
          fi
